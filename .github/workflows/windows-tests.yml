name: Windows Tests

# v5.0 稳定性优化：Windows 真机环境跑测试，覆盖后端核心链路。
# 触发：push / PR / 手动。
# 修复记录（v5.2.3）：
#   - PYTHONUTF8/PYTHONIOENCODING：Windows runner 捕获输出为 cp1252，
#     check_env/test 打印中文时 UnicodeEncodeError → 秒退（step "Environment check" 1s 失败）。
#   - fail-fast: false：矩阵两腿独立报告，避免一腿失败掩盖另一腿结果。
on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (all)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-agent.txt -r requirements-host.txt

      - name: Environment check
        run: python tools/check_env.py

      - name: Run test_api (Agent REST + WebSocket E2E)
        run: python tests/test_api.py

      - name: Run test_p0 (protocol/collectors smoke)
        run: python tests/test_p0.py
