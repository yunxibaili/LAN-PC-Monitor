<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAN-PC-Monitor — History Mockup v1</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Microsoft YaHei','Segoe UI',sans-serif; background:#0F1117; color:#E6EDF3; display:flex; height:100vh; }

.sidebar { width:240px; background:#161B22; border-right:1px solid #21262D; display:flex; flex-direction:column; flex-shrink:0; }
.sidebar-logo { padding:20px 20px 16px; border-bottom:1px solid #21262D; }
.sidebar-logo h2 { font-size:16px; font-weight:700; color:#E6EDF3; }
.sidebar-logo span { font-size:11px; color:#8B949E; }
.nav-section { padding:16px 12px 4px; font-size:10px; font-weight:600; color:#484F58; letter-spacing:1px; text-transform:uppercase; }
.nav-item { display:flex; align-items:center; gap:10px; padding:10px 16px; margin:2px 8px; border-radius:8px; color:#8B949E; font-size:13px; cursor:pointer; }
.nav-item:hover { background:#1C2333; color:#E6EDF3; }
.nav-item.active { background:rgba(59,130,246,0.12); color:#3B82F6; }

.main { flex:1; display:flex; flex-direction:column; overflow:auto; }
.header { height:56px; border-bottom:1px solid #21262D; display:flex; align-items:center; justify-content:space-between; padding:0 24px; background:#161B22; flex-shrink:0; }
.header-title { font-size:18px; font-weight:600; }

.content { padding:24px; overflow:auto; }
.section-title { font-size:11px; font-weight:600; color:#484F58; letter-spacing:1px; text-transform:uppercase; margin-bottom:16px; }

/* Time Selector */
.time-row { display:flex; gap:8px; margin-bottom:24px; align-items:center; }
.time-btn { padding:8px 20px; border:1px solid #21262D; border-radius:8px; background:transparent; color:#8B949E; font-size:13px; font-weight:600; cursor:pointer; transition:all .15s; }
.time-btn:hover { border-color:#3B82F6; color:#E6EDF3; }
.time-btn.active { background:#3B82F6; color:#fff; border-color:#3B82F6; }

/* Metric Toggle */
.metric-toggle { display:flex; gap:12px; margin-bottom:24px; }
.toggle { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; cursor:pointer; }
.toggle input { accent-color:#3B82F6; }

/* Summary Cards */
.summary-row { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:24px; }
.summary-card { background:#1C2333; border:1px solid #21262D; border-radius:12px; padding:20px; }
.summary-card .label { font-size:10px; font-weight:600; color:#484F58; letter-spacing:0.5px; margin-bottom:6px; }
.summary-card .value { font-size:28px; font-weight:700; }

/* Chart Card */
.card { background:#1C2333; border:1px solid #21262D; border-radius:12px; padding:20px; margin-bottom:24px; }
.card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.card-title { font-size:14px; font-weight:600; }

.chart-placeholder { height:200px; position:relative; }

/* Multi-metric charts */
.chart-stack { display:flex; flex-direction:column; gap:20px; }
.chart-section { background:#1C2333; border:1px solid #21262D; border-radius:12px; padding:20px; }
.chart-label { font-size:13px; font-weight:600; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.chart-dot { width:10px; height:10px; border-radius:50%; }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo"><h2>LAN-PC-Monitor</h2><span>Local Network Monitor</span></div>
  <div class="nav-section">MONITOR</div>
  <div class="nav-item">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    Dashboard
  </div>
  <div class="nav-item">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    Devices
  </div>
  <div class="nav-item active">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    History
  </div>
  <div class="nav-item">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    Alerts
  </div>
  <div class="nav-section">SYSTEM</div>
  <div class="nav-item">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    Settings
  </div>
</aside>

<div class="main">
  <div class="header"><div class="header-title">History</div></div>

  <div class="content">
    <!-- Time Range -->
    <div class="section-title">Time Range</div>
    <div class="time-row">
      <button class="time-btn">10 min</button>
      <button class="time-btn active">1 hour</button>
      <button class="time-btn">6 hours</button>
      <button class="time-btn">24 hours</button>
      <button class="time-btn">7 days</button>
    </div>

    <!-- Metric Toggles -->
    <div class="section-title">Metrics</div>
    <div class="metric-toggle">
      <label class="toggle"><input type="checkbox" checked> <span style="color:#3B82F6">CPU</span></label>
      <label class="toggle"><input type="checkbox" checked> <span style="color:#22C55E">GPU</span></label>
      <label class="toggle"><input type="checkbox"> <span style="color:#F59E0B">RAM</span></label>
      <label class="toggle"><input type="checkbox"> <span style="color:#EF4444">Network</span></label>
    </div>

    <!-- Summary -->
    <div class="summary-row">
      <div class="summary-card">
        <div class="label">Average</div>
        <div class="value" style="color:#3B82F6">45.6%</div>
      </div>
      <div class="summary-card">
        <div class="label">Peak</div>
        <div class="value" style="color:#EF4444">89.2%</div>
      </div>
      <div class="summary-card">
        <div class="label">Samples</div>
        <div class="value">12,540</div>
      </div>
    </div>

    <!-- Single Chart View -->
    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">CPU + GPU — Last 1 hour</div>
          <div style="font-size:11px;color:#8B949E;margin-top:2px">PC-001 · 12,540 samples · Updated 2 sec ago</div>
        </div>
      </div>
      <div class="chart-placeholder">
        <svg width="100%" height="180" viewBox="0 0 800 180" preserveAspectRatio="none">
          <line x1="0" y1="45" x2="800" y2="45" stroke="#21262D" stroke-width="1"/>
          <line x1="0" y1="90" x2="800" y2="90" stroke="#21262D" stroke-width="1"/>
          <line x1="0" y1="135" x2="800" y2="135" stroke="#21262D" stroke-width="1"/>
          <!-- CPU -->
          <polyline points="0,120 40,115 80,105 120,95 160,100 200,85 240,90 280,75 320,80 360,65 400,70 440,55 480,60 520,50 560,55 600,45 640,50 680,40 720,45 760,38 800,42" fill="none" stroke="#3B82F6" stroke-width="2"/>
          <polygon points="0,120 40,115 80,105 120,95 160,100 200,85 240,90 280,75 320,80 360,65 400,70 440,55 480,60 520,50 560,55 600,45 640,50 680,40 720,45 760,38 800,42 800,180 0,180" fill="rgba(59,130,246,0.08)"/>
          <!-- GPU -->
          <polyline points="0,130 40,120 80,110 120,100 160,105 200,90 240,95 280,80 320,85 360,70 400,75 440,60 480,65 520,55 560,60 600,50 640,55 680,45 720,50 760,42 800,48" fill="none" stroke="#22C55E" stroke-width="2"/>
          <!-- Y axis labels -->
          <text x="4" y="44" fill="#484F58" font-size="10">100%</text>
          <text x="4" y="89" fill="#484F58" font-size="10">50%</text>
          <text x="4" y="134" fill="#484F58" font-size="10">0%</text>
        </svg>
      </div>
      <div style="display:flex;gap:20px;margin-top:8px;font-size:11px;color:#8B949E;">
        <span><span style="display:inline-block;width:12px;height:2px;background:#3B82F6;margin-right:6px;vertical-align:middle"></span>CPU</span>
        <span><span style="display:inline-block;width:12px;height:2px;background:#22C55E;margin-right:6px;vertical-align:middle"></span>GPU</span>
      </div>
    </div>

    <!-- Multi-metric stacked view (alternative) -->
    <div class="section-title">Individual Metrics</div>
    <div class="chart-stack">
      <div class="chart-section">
        <div class="chart-label"><div class="chart-dot" style="background:#3B82F6"></div> CPU Usage</div>
        <svg width="100%" height="80" viewBox="0 0 800 80" preserveAspectRatio="none">
          <line x1="0" y1="40" x2="800" y2="40" stroke="#21262D" stroke-width="1"/>
          <polyline points="0,60 100,55 200,45 300,40 400,50 500,35 600,38 700,30 800,32" fill="none" stroke="#3B82F6" stroke-width="2"/>
          <polygon points="0,60 100,55 200,45 300,40 400,50 500,35 600,38 700,30 800,32 800,80 0,80" fill="rgba(59,130,246,0.06)"/>
        </svg>
      </div>
      <div class="chart-section">
        <div class="chart-label"><div class="chart-dot" style="background:#22C55E"></div> GPU Usage</div>
        <svg width="100%" height="80" viewBox="0 0 800 80" preserveAspectRatio="none">
          <line x1="0" y1="40" x2="800" y2="40" stroke="#21262D" stroke-width="1"/>
          <polyline points="0,65 100,58 200,50 300,42 400,55 500,38 600,40 700,32 800,35" fill="none" stroke="#22C55E" stroke-width="2"/>
          <polygon points="0,65 100,58 200,50 300,42 400,55 500,38 600,40 700,32 800,35 800,80 0,80" fill="rgba(34,197,94,0.06)"/>
        </svg>
      </div>
      <div class="chart-section">
        <div class="chart-label"><div class="chart-dot" style="background:#F59E0B"></div> RAM Usage</div>
        <svg width="100%" height="80" viewBox="0 0 800 80" preserveAspectRatio="none">
          <line x1="0" y1="40" x2="800" y2="40" stroke="#21262D" stroke-width="1"/>
          <polyline points="0,55 100,52 200,48 300,45 400,50 500,42 600,44 700,40 800,42" fill="none" stroke="#F59E0B" stroke-width="2"/>
          <polygon points="0,55 100,52 200,48 300,45 400,50 500,42 600,44 700,40 800,42 800,80 0,80" fill="rgba(245,158,11,0.06)"/>
        </svg>
      </div>
    </div>
  </div>
</div>

</body>
</html>
