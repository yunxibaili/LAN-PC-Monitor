<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>LAN-PC-Monitor — History</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','Microsoft YaHei','Segoe UI',sans-serif;background:#FFFFFF;color:#111827;display:flex;height:100vh}
.sidebar{width:240px;background:#F9FAFB;border-right:1px solid #E5E7EB;display:flex;flex-direction:column;flex-shrink:0}
.sidebar-logo{padding:16px 20px;border-bottom:1px solid #E5E7EB;display:flex;align-items:center;gap:10px}
.sidebar-logo .icon{width:28px;height:28px;background:#3B82F6;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px}
.sidebar-logo h2{font-size:15px;font-weight:600;color:#111827}
.nav-label{padding:16px 20px 4px;font-size:10px;font-weight:600;color:#9CA3AF;letter-spacing:.5px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 20px;margin:1px 8px;border-radius:6px;color:#6B7280;font-size:13px;cursor:pointer;transition:all .15s}
.nav-item:hover{background:#F3F4F6;color:#111827}
.nav-item.active{background:rgba(59,130,246,0.08);color:#3B82F6;font-weight:600;border-left:3px solid #3B82F6}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:auto}
.header{height:56px;border-bottom:1px solid #E5E7EB;display:flex;align-items:center;padding:0 24px;background:#fff;flex-shrink:0}
.content{padding:24px;overflow:auto}
.page-title{font-size:24px;font-weight:700;color:#111827}

.time-row{display:flex;gap:8px;margin-bottom:20px}
.time-btn{padding:8px 20px;border:1px solid #E5E7EB;border-radius:8px;background:#fff;color:#6B7280;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.time-btn:hover{border-color:#3B82F6;color:#111827}
.time-btn.active{background:#3B82F6;color:#fff;border-color:#3B82F6}

.metric-toggle{display:flex;gap:16px;margin-bottom:20px}
.toggle{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;cursor:pointer}
.toggle input{accent-color:#3B82F6}

.summary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.summary-card{background:#F3F4F6;border:1px solid #E5E7EB;border-radius:8px;padding:16px}
.summary-card .label{font-size:10px;font-weight:600;color:#9CA3AF;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.summary-card .value{font-size:28px;font-weight:700}

.card{background:#F3F4F6;border:1px solid #E5E7EB;border-radius:8px;padding:16px;margin-bottom:16px}
.card-title{font-size:14px;font-weight:600;color:#111827;margin-bottom:4px}
.card-sub{font-size:11px;color:#9CA3AF}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo"><div class="icon">PC</div><h2>PC 监控</h2></div>
  <div class="nav-label">监控</div>
  <div class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="4" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="10" width="7" height="11" rx="1.5"/></svg> 总览</div>
  <div class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg> 设备</div>
  <div class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg> 监控</div>
  <div class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3a6 6 0 00-6 6c0 6-3 7-3 7h18s-3-1-3-7a6 6 0 00-6-6z"/><path d="M10.5 21a1.5 1.5 0 003 0"/></svg> 告警</div>
  <div class="nav-label">系统</div>
  <div class="nav-item active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M8 4v6M16 4v6"/></svg> 历史</div>
  <div class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg> 设置</div>
</aside>

<div class="main">
  <div class="header"><div class="header-title">History</div></div>
  <div class="content">
    <div style="font-size:24px;font-weight:700;color:#111827;margin-bottom:20px">历史</div>

    <!-- Time Range -->
    <div style="font-size:11px;font-weight:600;color:#9CA3AF;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Time Range</div>
    <div class="time-row">
      <button class="time-btn">10 min</button>
      <button class="time-btn active">1 hour</button>
      <button class="time-btn">6 hours</button>
      <button class="time-btn">24 hours</button>
      <button class="time-btn">7 days</button>
    </div>

    <!-- Metrics -->
    <div style="font-size:11px;font-weight:600;color:#9CA3AF;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Metrics</div>
    <div class="metric-toggle">
      <label class="toggle"><input type="checkbox" checked> <span style="color:#3B82F6">CPU</span></label>
      <label class="toggle"><input type="checkbox" checked> <span style="color:#22C55E">GPU</span></label>
      <label class="toggle"><input type="checkbox"> <span style="color:#F59E0B">RAM</span></label>
      <label class="toggle"><input type="checkbox"> <span style="color:#F97316">Network</span></label>
    </div>

    <!-- Summary -->
    <div class="summary-row">
      <div class="summary-card"><div class="label">Average</div><div class="value" style="color:#3B82F6">45.6%</div></div>
      <div class="summary-card"><div class="label">Peak</div><div class="value" style="color:#EF4444">89.2%</div></div>
      <div class="summary-card"><div class="label">Samples</div><div class="value">12,540</div></div>
    </div>

    <!-- Chart -->
    <div class="card">
      <div class="card-title">CPU + GPU — Last 1 hour</div>
      <div class="card-sub">PC-001 · 12,540 samples</div>
      <div style="height:200px;margin-top:12px">
        <svg width="100%" height="180" viewBox="0 0 800 180">
          <line x1="0" y1="45" x2="800" y2="45" stroke="#E5E7EB" stroke-width="1"/>
          <line x1="0" y1="90" x2="800" y2="90" stroke="#E5E7EB" stroke-width="1"/>
          <line x1="0" y1="135" x2="800" y2="135" stroke="#E5E7EB" stroke-width="1"/>
          <text x="4" y="44" fill="#9CA3AF" font-size="10">100%</text>
          <text x="4" y="89" fill="#9CA3AF" font-size="10">50%</text>
          <text x="4" y="134" fill="#9CA3AF" font-size="10">0%</text>
          <polyline points="0,120 40,115 80,105 120,95 160,100 200,85 240,90 280,75 320,80 360,65 400,70 440,55 480,60 520,50 560,55 600,45 640,50 680,40 720,45 760,38 800,42" fill="none" stroke="#3B82F6" stroke-width="2"/>
          <polygon points="0,120 40,115 80,105 120,95 160,100 200,85 240,90 280,75 320,80 360,65 400,70 440,55 480,60 520,50 560,55 600,45 640,50 680,40 720,45 760,38 800,42 800,180 0,180" fill="rgba(59,130,246,0.08)"/>
          <polyline points="0,130 40,120 80,110 120,100 160,105 200,90 240,95 280,80 320,85 360,70 400,75 440,60 480,65 520,55 560,60 600,50 640,55 680,45 720,50 760,42 800,48" fill="none" stroke="#22C55E" stroke-width="2"/>
        </svg>
      </div>
      <div style="display:flex;gap:16px;font-size:11px;color:#9CA3AF;margin-top:8px">
        <span><span style="display:inline-block;width:12px;height:2px;background:#3B82F6;margin-right:6px;vertical-align:middle"></span>CPU</span>
        <span><span style="display:inline-block;width:12px;height:2px;background:#22C55E;margin-right:6px;vertical-align:middle"></span>GPU</span>
      </div>
    </div>

    <!-- Individual Metrics -->
    <div style="font-size:11px;font-weight:600;color:#9CA3AF;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Individual Metrics</div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="card" style="padding:12px 16px">
        <div style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600"><div style="width:10px;height:10px;border-radius:50%;background:#3B82F6"></div> CPU Usage</div>
        <svg width="100%" height="60" viewBox="0 0 800 60" style="margin-top:8px"><line x1="0" y1="30" x2="800" y2="30" stroke="#E5E7EB" stroke-width="1"/><polyline points="0,48 100,42 200,38 300,35 400,40 500,32 600,34 700,28 800,30" fill="none" stroke="#3B82F6" stroke-width="2"/><polygon points="0,48 100,42 200,38 300,35 400,40 500,32 600,34 700,28 800,30 800,60 0,60" fill="rgba(59,130,246,0.06)"/></svg>
      </div>
      <div class="card" style="padding:12px 16px">
        <div style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600"><div style="width:10px;height:10px;border-radius:50%;background:#22C55E"></div> GPU Usage</div>
        <svg width="100%" height="60" viewBox="0 0 800 60" style="margin-top:8px"><line x1="0" y1="30" x2="800" y2="30" stroke="#E5E7EB" stroke-width="1"/><polyline points="0,50 100,44 200,38 300,32 400,36 500,28 600,30 700,24 800,26" fill="none" stroke="#22C55E" stroke-width="2"/><polygon points="0,50 100,44 200,38 300,32 400,36 500,28 600,30 700,24 800,26 800,60 0,60" fill="rgba(34,197,94,0.06)"/></svg>
      </div>
      <div class="card" style="padding:12px 16px">
        <div style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600"><div style="width:10px;height:10px;border-radius:50%;background:#F59E0B"></div> RAM Usage</div>
        <svg width="100%" height="60" viewBox="0 0 800 60" style="margin-top:8px"><line x1="0" y1="30" x2="800" y2="30" stroke="#E5E7EB" stroke-width="1"/><polyline points="0,40 100,38 200,36 300,34 400,36 500,32 600,33 700,30 800,32" fill="none" stroke="#F59E0B" stroke-width="2"/><polygon points="0,40 100,38 200,36 300,34 400,36 500,32 600,33 700,30 800,32 800,60 0,60" fill="rgba(245,158,11,0.06)"/></svg>
      </div>
    </div>

  </div>
</div>

</body>
</html>
