<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAN-PC-Monitor · 历史页原型（浅色）</title>
<style>
  :root{
    --bg:#F5F7FB; --card:#FFFFFF;
    --border:#E6E7EB;
    --text:#1E2633; --text2:#626D7D; --text3:#9CA3AF;
    --green:#2FB344; --orange:#F59F00; --red:#D63939; --cyan:#0891B2; --blue:#3B82F6;
    --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Segoe UI','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden;font-size:13px;}
  .sidebar{width:220px;background:#1A2332;color:#B3BCCB;border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;flex-shrink:0;}
  .logo{height:56px;display:flex;align-items:center;gap:11px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.06);}
  .logo-badge{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#3B82F6,#2563EB);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;}
  .logo-txt{font-size:15px;font-weight:600;color:#fff;}
  .nav-sec{padding:16px 12px 4px 20px;font-size:10px;font-weight:600;letter-spacing:.5px;color:#7B8FA3;text-transform:uppercase;}
  .nav-sec.mt{margin-top:8px;}
  .nav-item{display:flex;align-items:center;gap:10px;margin:2px 8px;padding:9px 12px;border-radius:8px;color:#B3BCCB;cursor:pointer;font-weight:500;}
  .nav-item:hover{background:rgba(255,255,255,.05);color:#CBD5E1;}
  .nav-item.active{background:rgba(59,130,246,.16);color:#fff;position:relative;}
  .nav-item.active::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:#3B82F6;}
  .nav-item i{font-style:normal;width:18px;text-align:center;font-size:14px;}
  .nodes-wrap{flex:1;overflow:auto;padding:4px 0;}
  .nodes-title{padding:14px 20px 6px;font-size:10px;font-weight:600;letter-spacing:.5px;color:#7B8FA3;}
  .node-row{display:flex;align-items:center;gap:8px;padding:6px 20px;color:#B3BCCB;cursor:pointer;}
  .node-row.active{background:rgba(59,130,246,.16);color:#fff;}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .dot.g{background:#2FB344;box-shadow:0 0 0 0 rgba(47,179,68,.5);animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,179,68,.5)}70%{box-shadow:0 0 0 6px rgba(47,179,68,0)}100%{box-shadow:0 0 0 0 rgba(47,179,68,0)}}
  .node-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .node-score{font-size:11px;color:#7B8FA3;}
  .user-area{padding:10px 14px;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px;}
  .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#3B82F6,#169F85);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;}
  .user-meta .n{font-size:12px;font-weight:500;color:#fff;}
  .user-meta .r{font-size:11px;color:#7B8FA3;}
  .content{flex:1;display:flex;flex-direction:column;overflow:auto;padding:22px 26px;gap:16px;}
  .page-gap{display:flex;flex-direction:column;gap:16px;}
  .card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 2px 8px rgba(16,24,40,.04);}
  .toolbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .tb-label{font-size:12px;color:var(--text3);margin-right:2px;}
  .tb-btn{font-size:12px;padding:7px 14px;border-radius:8px;background:#F3F4F6;color:var(--text2);cursor:pointer;border:1px solid var(--border);font-weight:500;}
  .tb-btn.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600;}
  .sp{flex:1;}
  .btn-refresh{font-size:12px;padding:7px 14px;border-radius:8px;background:var(--blue);color:#fff;border:none;cursor:pointer;font-weight:600;}
  .metrics{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .met{display:flex;align-items:center;gap:7px;font-size:12px;padding:6px 12px;border-radius:7px;cursor:pointer;border:1px solid var(--border);color:var(--text2);}
  .met.sel{background:rgba(59,130,246,.06);border-color:var(--blue);color:var(--text);font-weight:600;}
  .met .swatch{width:10px;height:10px;border-radius:3px;}
  .met .check{margin-left:2px;font-size:10px;color:var(--blue);}
  .chart-wrap{padding:14px 16px;}
  .chart-h{display:flex;align-items:center;gap:8px;padding:0 2px 10px;}
  .chart-h .ttl{font-size:13px;font-weight:600;}
  .chart-h .sp{flex:1;}
  .chart-h .unit{font-size:10px;color:var(--text3);}
  .chart-lg{width:100%;height:300px;background:#F9FAFB;border:1px solid var(--border);border-radius:8px;}
  .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:0 16px 16px;}
  .stat-card{padding:14px 16px;border-left:3px solid var(--blue);background:#fff;border:1px solid var(--border);border-radius:10px;}
  .stat-card.g{border-left-color:var(--green);} .stat-card.o{border-left-color:var(--orange);}
  .stat-label{font-size:10px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;font-weight:600;}
  .stat-val{font-size:26px;font-weight:700;line-height:1.15;margin-top:4px;}
  .stat-sub{font-size:10px;color:var(--text2);margin-top:4px;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;}
  .lg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);}
  .lg-dot{width:10px;height:10px;border-radius:3px;}
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="logo"><div class="logo-badge">PC</div><div class="logo-txt">PC 监控</div></div>
    <div class="nav-sec">监控</div>
    <div class="nav-item"><i>▣</i> 总览</div>
    <div class="nav-item"><i>▣</i> 设备</div>
    <div class="nav-item"><i>▤</i> 监控</div>
    <div class="nav-item"><i>⚠</i> 告警</div>
    <div class="nav-sec mt">系统</div>
    <div class="nav-item active"><i>📈</i> 历史</div>
    <div class="nav-item"><i>⚙</i> 设置</div>
    <div class="nodes-wrap">
      <div class="nodes-title">已连接设备</div>
      <div class="node-row active"><span class="dot g"></span><span class="node-name">本机 (localhost)</span><span class="node-score">98</span></div>
      <div class="node-row"><span class="dot g"></span><span class="node-name">PC-102</span><span class="node-score">88</span></div>
    </div>
    <div class="user-area">
      <div class="avatar">A</div>
      <div class="user-meta"><div class="n">LAN-PC-Monitor</div><div class="r">v5.5</div></div>
    </div>
  </aside>

  <main class="content">
    <div class="page-gap">
      <div class="card">
        <div class="toolbar">
          <span class="tb-label">时间范围</span>
          <div class="tb-btn">10 分钟</div>
          <div class="tb-btn on">1 小时</div>
          <div class="tb-btn">6 小时</div>
          <div class="tb-btn">24 小时</div>
          <div class="tb-btn">7 天</div>
          <div class="sp"></div>
          <div class="btn-refresh">↻ 刷新</div>
        </div>
        <div class="metrics">
          <span class="tb-label">指标</span>
          <div class="met sel"><span class="swatch" style="background:#3B82F6"></span>CPU<span class="check">✓</span></div>
          <div class="met sel"><span class="swatch" style="background:#22C55E"></span>RAM<span class="check">✓</span></div>
          <div class="met sel"><span class="swatch" style="background:#F76707"></span>GPU<span class="check">✓</span></div>
          <div class="met"><span class="swatch" style="background:#D63939"></span>上传</div>
          <div class="met"><span class="swatch" style="background:#AE3EC9"></span>下载</div>
        </div>
        <div class="chart-wrap">
          <div class="chart-h"><span class="ttl">性能趋势</span><span class="unit">本机 (localhost) · 最近 1 小时</span></div>
          <svg class="chart-lg" viewBox="0 0 1000 300" preserveAspectRatio="none">
            <g stroke="rgba(30,38,51,.06)"><line x1="0" y1="60" x2="1000" y2="60"/><line x1="0" y1="120" x2="1000" y2="120"/><line x1="0" y1="180" x2="1000" y2="180"/><line x1="0" y1="240" x2="1000" y2="240"/></g>
            <g stroke="rgba(30,38,51,.04)"><line x1="125" y1="0" x2="125" y2="300"/><line x1="250" y1="0" x2="250" y2="300"/><line x1="375" y1="0" x2="375" y2="300"/><line x1="500" y1="0" x2="500" y2="300"/><line x1="625" y1="0" x2="625" y2="300"/><line x1="750" y1="0" x2="750" y2="300"/><line x1="875" y1="0" x2="875" y2="300"/></g>
            <polyline fill="none" stroke="#3B82F6" stroke-width="2" points="0,180 50,160 100,175 150,140 200,155 250,120 300,135 350,100 400,115 450,85 500,100 550,75 600,90 650,70 700,85 750,60 800,75 850,55 900,70 950,50 1000,60"/>
            <polyline fill="none" stroke="#22C55E" stroke-width="2" points="0,150 50,155 100,140 150,145 200,130 250,135 300,125 350,128 400,118 450,122 500,112 550,118 600,108 650,112 700,102 750,108 800,98 850,102 900,92 950,98 1000,88"/>
            <polyline fill="none" stroke="#F76707" stroke-width="2" points="0,200 50,190 100,205 150,180 200,195 250,170 300,185 350,160 400,175 450,150 500,165 550,140 600,155 650,135 700,150 750,130 800,145 850,125 900,140 950,120 1000,135"/>
          </svg>
          <div class="legend">
            <span class="lg-item"><span class="lg-dot" style="background:#3B82F6"></span>CPU</span>
            <span class="lg-item"><span class="lg-dot" style="background:#22C55E"></span>RAM</span>
            <span class="lg-item"><span class="lg-dot" style="background:#F76707"></span>GPU</span>
            <span class="lg-item"><span class="lg-dot" style="background:#D63939"></span>Upload</span>
            <span class="lg-item"><span class="lg-dot" style="background:#AE3EC9"></span>Download</span>
          </div>
        </div>
        <div class="stats-row">
          <div class="stat-card"><div class="stat-label">平均</div><div class="stat-val">38.6%</div><div class="stat-sub">3 指标</div></div>
          <div class="stat-card o"><div class="stat-label">峰值</div><div class="stat-val">66.4%</div><div class="stat-sub">10:32 出现</div></div>
          <div class="stat-card g"><div class="stat-label">样本数</div><div class="stat-val">3,600</div><div class="stat-sub">60 min</div></div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
